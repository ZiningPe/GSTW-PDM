[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GSTW-PDM"
version = "0.3.0"
description = "Generalized Spatio-Temporally Weighted Panel Data Model: spatial Durbin panels with same- and cross-period weights that may be endogenous (CF-QMLE, CF-2SLS, adjusted quasi-score, within-period QMLE)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "matplotlib", "tqdm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gstw_pdm*"]
